name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
      - develop
    paths-ignore:
    - "docs/**"
    - "README.md"

permissions:
    contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      # develop pushes publish to a separate "develop" release tag so they
      # don't clobber the nightly artifacts built from master.
      upload-tag: ${{ github.ref_name == 'develop' && 'develop' || 'nightly' }}
